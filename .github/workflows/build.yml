name: Build AI 3.95 firmware

on:
  push:
    branches: [ 3.95 ]
  pull_request:
    branches: [ 3.95 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          lfs: 'true'

      - name: Cache ESP-IDF
        id: cache-idf
        uses: actions/cache@v4
        with:
          path: /opt/esp-idf
          key: esp-idf-v5.5-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            esp-idf-v5.5-${{ runner.os }}-

      - name: Install ESP-IDF v5.5
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          git clone --branch v5.5.2 --depth 1 --recursive https://github.com/espressif/esp-idf.git /opt/esp-idf
          /opt/esp-idf/install.sh

      - name: Setup Python (idf.py needs >=3.9)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build AI 3.95 firmware
        env:
          IDF_PATH: /opt/esp-idf
          IDF_PYTHON_ENV_PATH: ${{ github.workspace }}/.venv
        shell: bash
        run: |
          set -euo pipefail
          source $IDF_PATH/export.sh
          cd $GITHUB_WORKSPACE
          # 选定目标芯片
          idf.py set-target esp32s3
          # 选板子（写到 sdkconfig）
          echo "CONFIG_BOARD_TYPE_AI_3_95=y" >> sdkconfig.defaults.esp32s3
          # 构建
          idf.py build

      - name: List build artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la build/*.bin build/*.elf 2>/dev/null || ls -la build/

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: ai-3.95-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/xiaozhi.bin
          if-no-files-found: warn
          retention-days: 30
